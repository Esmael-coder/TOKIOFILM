<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/403c4f083f.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Tokio Filme</title>
</head>
<body>
<header>
    <th:block th:fragment="header">

        <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom shadow-sm py-3">
            <div class="container">

                <!-- Logo -->
                <a class="navbar-brand fw-bold d-flex align-items-center gap-2"
                   th:href="@{/}">

                    <i class="bi bi-film text-warning fs-4"></i>

                    <span class="fs-4">
                    FILM<span class="text-warning">TOKIO</span>
                </span>

                </a>

                <!-- Mobile -->
                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbar">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <div class="collapse navbar-collapse" id="navbar">

                    <!-- Menu -->
                    <ul class="navbar-nav mx-auto gap-lg-2">

                        <li class="nav-item">
                            <a class="nav-link active rounded-pill px-3"
                               th:href="@{/}">
                                Home
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link rounded-pill px-3"
                               th:href="@{/films/search}">
                                Pesquisar Filme
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link rounded-pill px-3"
                               th:href="@{/persons/new}">
                                Criar Personagem
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link rounded-pill px-3"
                               th:href="@{/film/new}">
                                Novo Filme
                            </a>
                        </li>

                        <li class="nav-item"
                            sec:authorize="hasAuthority('ADMIN')">

                            <a class="nav-link rounded-pill px-3"
                               th:href="@{/signup}">
                                Cadastrar Utilizador
                            </a>

                        </li>

                    </ul>

                    <!-- Utilizador autenticado -->
                    <div sec:authorize="isAuthenticated()" class="dropdown">

                        <a href="#"
                           class="btn btn-outline-light rounded-pill dropdown-toggle d-flex align-items-center gap-2 px-2"
                           data-bs-toggle="dropdown">

                            <!-- ADMIN -->
                            <img sec:authorize="hasAuthority('ADMIN')"
                                 th:src="@{/uploads/users/admin.jpg}"
                                 class="rounded-circle border"
                                 width="42"
                                 height="42"
                                 alt="Perfil">

                            <!-- USER -->
                            <img sec:authorize="hasAuthority('USER')"
                                 th:src="@{/uploads/users/{file}(file=${#authentication.principal.user.profilePicture})}"
                                 class="rounded-circle border"
                                 width="42"
                                 height="42"
                                 alt="Perfil">

                            <span th:text="${#authentication.principal.user.username}"></span>

                        </a>

                        <ul class="dropdown-menu dropdown-menu-end shadow">

                            <li>
                                <a th:href="@{/profile}"
                                   class="dropdown-item d-flex align-items-center gap-2">
                                    <i class="bi bi-person-circle"></i>
                                    Perfil
                                </a>
                            </li>

                            <li><hr class="dropdown-divider"></li>

                            <li>
                                <form th:action="@{/logout}" method="post" class="m-0">
                                    <button type="submit"
                                            class="dropdown-item d-flex align-items-center gap-2 text-danger">
                                        <i class="bi bi-box-arrow-right"></i>
                                        Logout
                                    </button>
                                </form>
                            </li>

                        </ul>

                    </div>

                    <!-- Visitante -->
                    <div sec:authorize="isAnonymous()"
                         class="dropdown">

                        <a href="#"
                           class="btn btn-outline-light rounded-pill dropdown-toggle d-flex align-items-center gap-2 px-2"
                           data-bs-toggle="dropdown">

                            <i class="fa-solid fa-user-xmark"></i>

                            <span>Visitante</span>

                        </a>

                        <ul class="dropdown-menu dropdown-menu-end shadow">

                            <li>

                                <a class="dropdown-item"
                                   th:href="@{/login}">

                                    <i class="bi bi-box-arrow-in-right me-2"></i>

                                    Login

                                </a>

                            </li>

                        </ul>

                    </div>

                </div>

            </div>
        </nav>

    </th:block>
</header>
<footer>
    <th:block th:fragment="footer">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script th:src="@{/javaScript/alerts.js}"></script>
    </th:block>
</footer>
</body>
</html>
