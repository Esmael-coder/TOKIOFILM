<!DOCTYPE html>
<html lang="pt-pt" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>

<body>
<header th:replace="~{fragments/layout :: header}"></header>


<div class="container py-5">

    <!-- Título -->

    <div class="text-center mb-5">

        <h1 class="fw-bold">
            <i class="bi bi-film text-warning"></i>
            Procurar Filme
        </h1>

        <p class="text-muted">
            Pesquisar filmes pelo título.
        </p>

    </div>

    <!-- Pesquisa -->

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <form th:action="@{/films/search/result}" method="get">

                <div class="input-group input-group-lg shadow-sm">

                    <input
                            type="search"
                            class="form-control"
                            name="title"
                            placeholder="Ex.: Avatar"
                            th:value="${param.title}">

                    <button
                            class="btn btn-dark"
                            type="submit">

                        <i class="bi bi-search"></i>

                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- Resultados -->

    <div class="mt-5"
         th:if="${films != null and !#lists.isEmpty(films)}">

        <h3 class="mb-4">
            Resultados encontrados
        </h3>

        <div class="row g-4">

            <div class="col-sm-6 col-md-4 col-lg-3"
                 th:each="film : ${films}">

                <div class="card movie-card h-100 shadow">

                    <img
                            th:src="@{/uploads/films/{file}(file=${film.poster})}"
                            class="card-img-top movie-poster"
                            alt="Cartaz">

                    <div class="card-body d-flex flex-column">

                        <h5 class="card-title fw-bold"
                            th:text="${film.title}">
                            Título
                        </h5>

                        <p class="text-muted mb-3">

                            <i class="bi bi-calendar-event"></i>

                            <span th:text="${film.year}">
                                2025
                            </span>

                        </p>

                        <a th:href="@{/films/{id}(id=${film.id})}" class="btn btn-outline-primary mt-auto">
                            Ver detalhes
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
